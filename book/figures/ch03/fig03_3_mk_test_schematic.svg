   <g id="text_10">
    <text style="font-size: 7.5px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'; text-anchor: start" x="25.511811" y="164.649579" transform="rotate(-0 25.511811 164.649579)">Neutral expectation: Dn / Ds = Pn / Ps</text>
