   <g id="text_11">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'; text-anchor: start" x="243.212598" y="20.706109" transform="rotate(-0 243.212598 20.706109)">Adaptive proportion</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(243.212598 34.772508)">alpha = 1 - (Ds x Pn) / (Dn x Ps)</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(243.212598 41.502489)"/>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(243.212598 51.852782)">alpha &gt; 0: excess nonsynonymous</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(243.212598 61.084715)">fixed differences</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'; text-anchor: start" x="243.212598" y="115.950203" transform="rotate(-0 243.212598 115.950203)">Bias to correct</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(243.212598 130.016603)">Slightly deleterious polymorphisms</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(243.212598 138.556739)">inflate Pn and push alpha down;</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(243.212598 147.096876)">fit the DFE or drop rare variants</text>
   </g>
