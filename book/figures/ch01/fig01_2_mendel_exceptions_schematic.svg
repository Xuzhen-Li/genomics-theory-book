   <g id="text_1">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'; text-anchor: start" x="16.599685" y="18.580124" transform="rotate(-0 16.599685 18.580124)">Law of segregation</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(16.599685 38.565264)">Aa gives A and a gametes 1:1</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(16.599685 47.793369)">F2 of Aa x Aa: 1 AA : 2 Aa : 1 aa</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(16.599685 56.208819)">Test cross Aa x aa: 1 Aa : 1 aa</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'; text-anchor: start" x="270.782362" y="18.580124" transform="rotate(-0 270.782362 18.580124)">Law of independent assortment</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(270.782362 39.257061)">Unlinked loci A and B combine at random</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(270.782362 47.704776)">F2: 9 : 3 : 3 : 1</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(270.782362 56.208819)">Test cross: 1 : 1 : 1 : 1</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'; text-anchor: middle" x="259.370079" y="80.942329" transform="rotate(-0 259.370079 80.942329)">Exceptions change the ratios, not the particulate gene</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'; text-anchor: start" x="16.599685" y="107.871463" transform="rotate(-0 16.599685 107.871463)">Linkage</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(16.599685 127.856603)">Loci on one chromosome co-segregate;</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(16.599685 137.088536)">recombination fraction &lt; 0.5</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(16.599685 144.936876)">(Morgan 1910; Sturtevant 1913)</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'; text-anchor: start" x="187.783937" y="107.871463" transform="rotate(-0 187.783937 107.871463)">Segregation distortion</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(187.783937 127.856603)">Drive or killer-protector systems;</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(187.783937 136.396739)">rice S5 locus in indica x japonica</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(187.783937 144.936876)">(Sandler &amp; Novitski 1957; Yang 2012)</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'; text-anchor: start" x="358.968189" y="107.871463" transform="rotate(-0 358.968189 107.871463)">Parent-of-origin effects</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(358.968189 127.856603)">Expression depends on the parent</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(358.968189 136.675099)">that transmitted the allele;</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(358.968189 144.938517)">maize R-mottled (Kermicle 1970)</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'; text-anchor: start" x="16.599685" y="201.41477" transform="rotate(-0 16.599685 201.41477)">Paramutation</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(16.599685 221.39991)">One allele changes the heritable</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(16.599685 230.218406)">state of the other; maize b1, R</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(16.599685 238.481824)">(Brink 1956; Chandler 2007)</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'; text-anchor: start" x="187.783937" y="201.41477" transform="rotate(-0 187.783937 201.41477)">Organelle inheritance</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(187.783937 222.091707)">Plastids and mitochondria sort out</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(187.783937 230.631843)">without Mendelian ratios</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(187.783937 238.480183)">(Baur; Hagemann 2000)</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'; text-anchor: start" x="358.968189" y="201.41477" transform="rotate(-0 358.968189 201.41477)">Polysomic segregation</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(358.968189 221.39991)">Autotetraploid AAaa gametes</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(358.968189 229.940046)">AA : Aa : aa = 1 : 4 : 1, plus</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(358.968189 238.481824)">double reduction (Haldane 1930)</text>
   </g>
  </g>
 </g>
