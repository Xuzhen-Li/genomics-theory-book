   <g id="text_1">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'; text-anchor: start" x="161.846929" y="16.028943" transform="rotate(-0 161.846929 16.028943)">Locus departs from HWE</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'; text-anchor: start" x="161.846929" y="32.068256" transform="rotate(-0 161.846929 32.068256)">First check: exact test, multiple testing, power</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'; text-anchor: start" x="16.599685" y="77.25729" transform="rotate(-0 16.599685 77.25729)">Heterozygote deficit (F &gt; 0)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(16.599685 93.296603)">Many loci: selfing, inbreeding,</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(16.599685 101.83838)">or Wahlund effect (structure)</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(16.599685 110.376876)">Few loci: null alleles, allele dropout,</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(16.599685 118.917013)">low depth, selection</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'; text-anchor: start" x="187.783937" y="77.25729" transform="rotate(-0 187.783937 77.25729)">Heterozygote excess (F &lt; 0)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(187.783937 93.296603)">Many loci: clonality, small number</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(187.783937 101.836739)">of parents, outbreeding</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(187.783937 110.376876)">Few loci: collapsed paralogs,</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(187.783937 118.917013)">heterozygote advantage</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'; text-anchor: start" x="358.968189" y="77.25729" transform="rotate(-0 358.968189 77.25729)">Sex- or ploidy-specific</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(358.968189 93.988399)">X-linked: use males as well</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(358.968189 101.836739)">Polyploids: model dosage and</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(358.968189 111.068673)">double reduction</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(358.968189 118.917013)">Haplodiploids: separate sexes</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'; text-anchor: start" x="16.599685" y="181.57225" transform="rotate(-0 16.599685 181.57225)">Technical checks before biology</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(16.599685 197.611563)">Does F track read depth or missingness?   Are heterozygote read ratios far from 0.5?</text>
    <text style="font-size: 7px; font-family: 'Liberation Sans', 'Noto Sans CJK SC'" transform="translate(16.599685 206.1517)">Are clones, synonyms or relatives in the sample?   Does the pattern hold within each genetic cluster?</text>
   </g>
